<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="190" fill="#ffffff" opacity="0.12"/>
  
  <!-- Graduation / Education Cap Icon -->
  <g transform="translate(256, 200)" filter="url(#shadow)">
    <polygon points="0,-75 140,0 0,75 -140,0" fill="#ffffff"/>
    <polygon points="0,-60 115,0 0,60 -115,0" fill="#f8fafc"/>
    <path d="M -80,25 L -80,95 C -80,135 80,135 80,95 L 80,25 Z" fill="#e2e8f0"/>
    <path d="M 140,0 L 160,20 L 160,85 L 148,85 L 148,30 Z" fill="#fbbf24"/>
    <circle cx="154" cy="95" r="9" fill="#f59e0b"/>
  </g>

  <!-- Rupee Symbol Shield Badge -->
  <g transform="translate(256, 360)">
    <circle cx="0" cy="0" r="64" fill="#10b981" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="54" fill="#059669"/>
    <!-- Rupee symbol -->
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="70" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>
  </g>
</svg>
